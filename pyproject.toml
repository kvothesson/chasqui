[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chasqui"
version = "0.1.0"
description = "Real-time simultaneous translation. Speak your language. Be understood."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["translation", "real-time", "speech", "ai", "gpt4o"]
dependencies = [
    "openai>=1.40.0",
    "websockets>=12.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
chasqui = "chasqui.cli:cli"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "black", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py311"
