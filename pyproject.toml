[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chasqui-translate"
# Single source of truth is chasqui/__init__.py — see [tool.setuptools.dynamic].
dynamic = ["version"]
description = "Real-time simultaneous translation. Speak your language. Be understood."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "kvothesson"}]
keywords = ["translation", "real-time", "speech", "ai", "interpreter", "realtime-api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    # Windows-first and honest about it: the headset/media adapters switch
    # Windows default devices through PowerShell, and the virtual-cable setup
    # they depend on is Windows-only. The text adapter runs anywhere.
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "openai>=1.40.0",
    "websockets>=12.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/kvothesson/chasqui"
Issues = "https://github.com/kvothesson/chasqui/issues"

[project.scripts]
chasqui = "chasqui.cli:cli"

# Windowed launcher: no console window behind the UI. Console scripts always
# open one on Windows, which is right for a terminal and wrong for a desktop
# shortcut. `chasqui ui` still works — this is the shortcut-friendly door.
[project.gui-scripts]
chasqui-ui = "chasqui.cli:ui_entry"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "black", "ruff"]

[tool.setuptools.dynamic]
version = {attr = "chasqui.__version__"}

[tool.setuptools.packages.find]
include = ["chasqui*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
