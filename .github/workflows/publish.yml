name: Publish

# Trusted publishing: PyPI trusts this workflow by name, so there is no API
# token stored anywhere. Each index needs it registered once as a publisher
# (owner kvothesson, repo chasqui, workflow publish.yml, environment below).
#
#   GitHub release published  →  PyPI
#   Run workflow (manual)     →  TestPyPI, to rehearse a release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      # A release tagged v0.3.0 must ship 0.3.0. The version lives in
      # chasqui/__init__.py, and forgetting to bump it would upload the
      # previous number again (PyPI refuses it, but only after the tag exists).
      - name: Tag matches package version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('chasqui/__init__.py').read())[1])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/chasqui-translate/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/chasqui-translate/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
