name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # windows-latest: chasqui is Windows-first (windevice, MME device handling)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -q
