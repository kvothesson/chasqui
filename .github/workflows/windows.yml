name: Windows installer

# Builds chasqui-setup-<version>.exe on a clean GitHub runner, so the
# installer people download is made from the tagged source and nothing else
# (code signing through SignPath Foundation requires exactly that).
#
#   GitHub release published  →  build, attach the .exe to the release
#   Run workflow (manual)     →  build, keep the .exe as a run artifact
#   PR touching packaging/    →  build, to catch a broken installer early

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/windows.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Same check as publish.yml: a release tagged v0.3.0 must ship 0.3.0.
      - name: Tag matches package version
        if: github.event_name == 'release'
        shell: bash
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('chasqui/__init__.py').read())[1])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          fi

      # The runner's Python is clean, which is what build_windows.py asks for:
      # PyInstaller packs whatever the interpreter can import.
      - run: pip install -e . pyinstaller==6.17.0

      # build_windows.py copies this module into the app. Pinned so a new
      # upstream release cannot change what ships without a commit here.
      # AllUsers, not CurrentUser: the build step runs under pwsh 7, whose
      # PSModulePath leaks into the powershell 5.1 that build_windows.py
      # spawns and hides Documents\WindowsPowerShell\Modules from it.
      - name: AudioDeviceCmdlets
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module AudioDeviceCmdlets -RequiredVersion 3.1.0.2 -Scope AllUsers -Force

      - name: Inno Setup
        shell: powershell
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - run: python packaging/build_windows.py

      - name: Installer exists
        id: setup
        shell: bash
        run: |
          file=$(ls dist/chasqui-setup-*.exe)
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "### $(basename "$file")" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: \`$(sha256sum "$file" | cut -d' ' -f1)\`" >> "$GITHUB_STEP_SUMMARY"

      # When SignPath approves the project, the signing step goes here: it
      # takes this artifact, signs it, and the release gets the signed one.
      - uses: actions/upload-artifact@v6
        with:
          name: chasqui-setup
          path: ${{ steps.setup.outputs.file }}
          if-no-files-found: error

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: chasqui-setup
      - run: gh release upload "$GITHUB_REF_NAME" chasqui-setup-*.exe --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
